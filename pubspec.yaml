name: dnd_campaign_manager
description: JSON-backed character sheet manager for a custom D&D campaign.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.10.0
  file_picker: ^13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  googleapis: ^17.0.0
  http: ^1.6.0
  image: ^4.10.1
  multiview_desktop: ^2.0.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - content/tarkov_character_options.json
    - content/skills.json
    - content/tarkov_mechanics.json
    - content/tarkov_armory.json
    - content/character_creation.json
